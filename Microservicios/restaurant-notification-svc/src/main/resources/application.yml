spring:
  application:
    name: restaurant-notification-svc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  messages:
    basename: i18n/messages
    encoding: UTF-8

server:
  port: 8082
  shutdown: graceful

aws:
  region: ${AWS_REGION:us-east-1}
  sqs:
    queue-name: ${SQS_QUEUE_NAME:restaurant-notifications-queue}
  ses:
    sender-email: ${SES_SENDER_EMAIL:no-reply@restaurant-lab.com}

notification:
  default-recipient-email: ${DEFAULT_RECIPIENT_EMAIL:lab-test@example.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
