#
# Docker Compose para desarrollo local con LocalStack.
#
# LocalStack emula servicios AWS localmente:
#   - DynamoDB, SNS, SQS, S3, Cognito (versión light)
#
# Uso:
#   docker-compose up -d
#   ./scripts/init-localstack.sh   # crea tablas/topics/queues en LocalStack
#   # ahora los microservicios pueden correr con SPRING_PROFILES_ACTIVE=local
#
# Para probar contra AWS REAL:
#   - Detener LocalStack: docker-compose down
#   - Configurar variables: AWS_PROFILE o AWS_ACCESS_KEY_ID/SECRET
#   - Correr servicios con SPRING_PROFILES_ACTIVE=aws
#
version: '3.9'

services:

  localstack:
    image: localstack/localstack:3.8
    container_name: restaurant-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sns,sqs,s3,ses,cognito-idp
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init.sh"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - restaurant-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  reservation-svc:
    build:
      context: .
      dockerfile: restaurant-reservation-svc/Dockerfile
    container_name: reservation-svc
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - DYNAMODB_TABLE_NAME=restaurant-reservations
      - SNS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:restaurant-notifications
      - COGNITO_ISSUER_URI=http://localstack:4566/us-east-1_local
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - restaurant-net

  search-svc:
    build:
      context: .
      dockerfile: restaurant-search-svc/Dockerfile
    container_name: search-svc
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - DYNAMODB_TABLE_NAME=restaurant-restaurants
      - COGNITO_ISSUER_URI=http://localstack:4566/us-east-1_local
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - restaurant-net

  notification-svc:
    build:
      context: .
      dockerfile: restaurant-notification-svc/Dockerfile
    container_name: notification-svc
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SQS_QUEUE_NAME=restaurant-notifications-queue
      - SES_SENDER_EMAIL=test@localhost
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - restaurant-net

networks:
  restaurant-net:
    driver: bridge
